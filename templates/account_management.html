<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Management — Device Management</title>
<script>if (window.self !== window.top) document.documentElement.classList.add("in-iframe");</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  html, body { height: auto; overflow: auto; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 32px 60px; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .pagetitle { font-size: 20px; font-weight: 800; color: #90207a; margin: 0; }
  .btn { padding: 9px 16px; border: 1px solid transparent; border-radius: 8px; font-weight: 600; cursor: pointer; font: inherit; }
  .btn.primary { background: #FFCC00; color: #1c1917; } .btn.primary:hover { background: #f0c000; }
  .btn.ghost { background: #fff; border-color: #d6d3d1; color: #44403c; } .btn.ghost:hover { background: #fafaf9; }
  .btn.danger { background: #fff; border-color: #fecaca; color: #b91c1c; } .btn.danger:hover { background: #fef2f2; }
  .tablewrap { overflow-x: auto; background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #1e3a5f; color: #fff; text-align: left; padding: 12px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid #f0eee6; font-size: 13px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  .role-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #dcfce7; color: #14532d; }
  .role-badge.admin { background: #fee2e2; color: #991b1b; }
  .st { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .st.on { background: #dcfce7; color: #14532d; } .st.off { background: #f5f5f4; color: #a8a29e; }
  .sites-cell { font-size: 12px; color: #57534e; max-width: 260px; }
  .tbl-btn { background: #FFCC00; color: #1c1917; border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 700; cursor: pointer; }
  .tbl-btn:hover { background: #f0c000; }
  .fieldlbl { font-size: 11px; color: #78716c; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .fieldlbl .lh { text-transform: none; letter-spacing: 0; color: #a8a29e; font-weight: 600; }
  input[type=text], input[type=email], input[type=password], select { width: 100%; padding: 9px 12px; border: 1px solid #d6d3d1; border-radius: 8px; font: inherit; box-sizing: border-box; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chk input { width: auto; }
  .pw-row { display: flex; gap: 8px; }
  .pw-row input { flex: 1; }
  .pw-gen { white-space: nowrap; padding: 9px 12px; border: 1px solid #d6d3d1; background: #fff; border-radius: 8px; font: inherit; font-weight: 600; color: #44403c; cursor: pointer; }
  .pw-gen:hover { background: #fafaf9; border-color: #90207a; color: #90207a; }
  .site-checks { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
  .site-checks label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .site-checks input { width: auto; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,12,8,.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1500; }
  .modal-box { background: #fff; border-radius: 14px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.3); max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 18px; font-weight: 800; color: #90207a; margin-bottom: 6px; }
  .modal-acts { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #1c1917; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; transition: .2s; z-index: 1600; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="AEON delight — home">
      <img src="{{ url_for('static', filename='aeon_banner.png') }}" alt="AEON delight">
      <span class="brand-text">
        <span class="l2">Device Management</span>
      </span>
    </a>
    <div class="menu-wrap">
      <button class="burger" id="burgerBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <div class="menu" id="menu" hidden>
        <div class="who">
          <div class="r">{{ user.name or user.email }}</div>
          <div class="s">Admin — all sites</div>
        </div>
        <a href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/><path d="M9 21v-6h6v6"/></svg>
          Homepage
        </a>
        <button type="button" data-action="changepw">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg>
          更改密碼 Change password
        </button>
        <button type="button" data-action="logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          登出 Sign out
        </button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="head-row">
      <h1 class="pagetitle">帳戶管理 Account Management</h1>
      <button class="btn primary" id="addUserBtn">+ Add User</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Sites</th><th>Status</th><th style="text-align:right;">Actions</th></tr></thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit user modal -->
  <div class="modal-overlay" id="userModal" hidden><div class="modal-box">
    <div class="modal-title" id="umTitle">Add User</div>
    <div class="fieldlbl">Email</div><input type="email" id="umEmail" placeholder="user@aeondelightasia.com">
    <div class="fieldlbl">Name</div><input type="text" id="umName" placeholder="Full name">
    <div class="fieldlbl" id="umPwLabel">Password <span class="lh">(6 characters)</span></div>
    <div class="pw-row">
      <input type="text" id="umPass" autocomplete="new-password" placeholder="Set a password">
      <button type="button" class="pw-gen" id="umPwGen">Generate</button>
    </div>
    <div class="fieldlbl">Role</div>
    <select id="umRole">
      <option value="user">User — view only, scoped by site</option>
      <option value="admin">Admin — full access, all sites</option>
    </select>
    <label class="chk" style="margin-top:12px;"><input type="checkbox" id="umActive" checked> <span>Active</span></label>
    <div class="fieldlbl">Site access <span id="umSiteNote" style="text-transform:none; font-weight:400;"></span></div>
    <div class="site-checks" id="umSites"></div>
    <div class="modal-acts">
      <button class="btn danger" id="umDelete" hidden>Delete</button><span style="flex:1;"></span>
      <button class="btn ghost" id="umCancel">Cancel</button><button class="btn primary" id="umSave">Save</button>
    </div>
  </div></div>

  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='navbar.js') }}"></script>
  <script src="{{ url_for('static', filename='change-password.js') }}"></script>
  <script>
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var users = [], sites = [];
    var toastTimer;
    function toast(m) { var t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); }
    function roleLabel(r) { return r === "admin" ? "Admin" : "User"; }

    function api(method, path, body) {
      return fetch(path, { method: method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined })
        .then(function (r) { if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname); throw { h: 1 }; } return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || "Request failed"); return j; }); });
    }
    function handleErr(e) { if (e && e.h) return; toast((e && e.message) || "Something went wrong."); }

    function renderRows() {
      var body = $("#userRows");
      body.innerHTML = users.map(function (u) {
        var siteNames = (u.sites || []).map(function (code) {
          var s = sites.filter(function (x) { return x.code === code; })[0];
          return s ? s.code : code;
        });
        var sitesTxt = u.role === "admin" ? "All (Admin)" : (siteNames.length ? siteNames.join(", ") : "— none granted —");
        return '<tr data-email="' + esc(u.email) + '">' +
          '<td>' + esc(u.email) + '</td>' +
          '<td>' + esc(u.name || "—") + '</td>' +
          '<td><span class="role-badge ' + (u.role === "admin" ? "admin" : "") + '">' + roleLabel(u.role) + '</span></td>' +
          '<td class="sites-cell">' + esc(sitesTxt) + '</td>' +
          '<td><span class="st ' + (u.active ? "on" : "off") + '">' + (u.active ? "Active" : "Inactive") + '</span></td>' +
          '<td style="text-align:right;"><button class="tbl-btn u-edit">Edit</button></td></tr>';
      }).join("");
    }
    $("#userRows").addEventListener("click", function (e) { if (!e.target.closest(".u-edit")) return; var email = e.target.closest("tr").getAttribute("data-email"); openUserModal(users.filter(function (x) { return x.email === email; })[0]); });
    $("#addUserBtn").addEventListener("click", function () { openUserModal(null); });

    var editingEmail = null;
    function renderSiteChecks(selected) {
      selected = selected || [];
      $("#umSites").innerHTML = sites.length ? sites.map(function (s) {
        return '<label><input type="checkbox" value="' + esc(s.code) + '"' + (selected.indexOf(s.code) >= 0 ? " checked" : "") + '> ' + esc(s.code) + ' — ' + esc(s.name) + '</label>';
      }).join("") : '<span style="font-size:12px;color:#78716c;">No sites configured.</span>';
    }
    function syncSitesDisabled() {
      var isAdmin = $("#umRole").value === "admin";
      $("#umSiteNote").textContent = isAdmin ? "— Admins can access all sites" : "";
      Array.prototype.forEach.call($("#umSites").querySelectorAll("input"), function (i) { i.disabled = isAdmin; });
    }
    $("#umRole").addEventListener("change", syncSitesDisabled);

    function openUserModal(u) {
      editingEmail = u ? u.email : null;
      $("#umTitle").textContent = u ? "Edit User" : "Add User";
      $("#umEmail").value = u ? u.email : ""; $("#umEmail").readOnly = !!u;
      $("#umName").value = u ? (u.name || "") : "";
      $("#umPass").value = "";
      $("#umPwLabel").innerHTML = u ? 'New password <span class="lh">(leave blank to keep current)</span>' : 'Password <span class="lh">(6 characters)</span>';
      $("#umPass").placeholder = u ? "Leave blank to keep current" : "Set a password";
      $("#umRole").value = u ? u.role : "user";
      $("#umActive").checked = u ? !!u.active : true;
      renderSiteChecks(u ? u.sites : []);
      syncSitesDisabled();
      $("#umDelete").hidden = !u;
      $("#userModal").hidden = false;
    }
    function closeUserModal() { $("#userModal").hidden = true; editingEmail = null; }
    $("#umCancel").addEventListener("click", closeUserModal);
    $("#userModal").addEventListener("click", function (e) { if (e.target === $("#userModal")) closeUserModal(); });
    $("#umPwGen").addEventListener("click", function () {
      var chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
      var arr = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(8)) : null;
      var out = "";
      for (var i = 0; i < 8; i++) { var r = arr ? arr[i] : Math.floor(Math.random() * 0xffffffff); out += chars[r % chars.length]; }
      $("#umPass").value = out; $("#umPass").focus();
    });
    $("#umSave").addEventListener("click", function () {
      var email = $("#umEmail").value.trim().toLowerCase();
      var pass = $("#umPass").value;
      if (!editingEmail && pass.length < 6) { toast("Set a password of at least 6 characters."); $("#umPass").focus(); return; }
      if (editingEmail && pass.length && pass.length < 6) { toast("New password must be at least 6 characters."); $("#umPass").focus(); return; }
      var payload = {
        name: $("#umName").value.trim(), role: $("#umRole").value, active: $("#umActive").checked,
        sites: Array.prototype.map.call($("#umSites").querySelectorAll("input:checked"), function (i) { return i.value; })
      };
      if (pass.length) payload.password = pass;
      var req;
      if (editingEmail) req = api("PUT", "/api/accounts/" + encodeURIComponent(editingEmail), payload);
      else { payload.email = email; req = api("POST", "/api/accounts", payload); }
      req.then(function () { closeUserModal(); load(); toast("Account saved."); }).catch(handleErr);
    });
    $("#umDelete").addEventListener("click", function () {
      if (!editingEmail) return;
      if (!confirm('Delete account "' + editingEmail + '"?')) return;
      api("DELETE", "/api/accounts/" + encodeURIComponent(editingEmail)).then(function () { closeUserModal(); load(); toast("Deleted."); }).catch(handleErr);
    });

    function load() {
      api("GET", "/api/accounts").then(function (j) { users = j.accounts || []; sites = j.sites || []; renderRows(); }).catch(handleErr);
    }
    load();
  </script>
</body>
</html>
